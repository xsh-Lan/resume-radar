<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>简历雷达 · 原件对照</title><style>/* RADAR_CSS */</style></head>
<body>
<header class="app-header"><a class="brand" href="#" aria-label="简历雷达首页"><span class="brand-mark" aria-hidden="true">◉</span><span>简历雷达<small>让每一条建议回到原文</small></span></a><div class="target-context"><span class="context-label">本次目标</span><strong id="target-name"></strong></div><a class="original-link" href="original.pdf" target="_blank" rel="noopener">打开 PDF 原件 ↗</a></header>
<nav class="main-nav" aria-label="报告导航"><button data-view="overview" aria-current="page">整体判断</button><button data-view="modules">模块诊断</button><button data-view="reviews">逐句审阅 <span id="review-count"></span></button><button data-view="questions">待补充事项</button><button data-view="requirements">岗位要求</button><button data-view="library">经历示例库</button></nav>
<main class="workspace">
<section class="document-panel" aria-label="简历原件"><div class="document-toolbar"><div><strong id="filename"></strong><span id="page-count" class="muted"></span></div><div class="document-controls"><label class="check-label"><input type="checkbox" id="show-kept">标记保留项</label><button id="zoom-out" aria-label="缩小简历">−</button><output id="zoom-value">100%</output><button id="zoom-in" aria-label="放大简历">＋</button></div></div><div class="document-scroll" id="document-scroll" tabindex="0"><div id="pdf-pages"></div></div><div class="document-footer"><span><i class="legend-dot"></i>待优化 <i class="legend-dot selected-dot"></i>当前对照</span><span id="mapping-summary"></span></div></section>
<aside class="analysis-panel" aria-label="诊断与案例"><div class="analysis-heading"><div><span class="eyebrow" id="view-eyebrow">本次评估</span><h1 id="view-title">整体判断</h1></div><span class="local-label">本机报告</span></div><div id="analysis-content" class="analysis-content" tabindex="-1"></div></aside>
</main>
<div id="toast" role="status" aria-live="polite" hidden></div>
<dialog id="case-dialog" aria-labelledby="case-title"><header class="dialog-header"><div><span class="eyebrow">固定经历示例</span><h2 id="case-title"></h2></div><button id="close-case" aria-label="关闭案例">✕</button></header><div id="case-meta"></div><div class="case-tabs" role="group" aria-label="示例表达方式"><button data-case-tab="work">工作经历</button><button data-case-tab="cstar">C-STAR 拆解</button><button data-case-tab="natural">自然表达</button></div><div id="case-body"></div><footer class="dialog-footer"><span>来源：Hired 固定示例库</span><button id="copy-case" class="primary-button">复制当前表达</button></footer></dialog>
<script src="library.js"></script><script>/* RADAR_DATA */
/* RADAR_JS */</script>
</body></html>
