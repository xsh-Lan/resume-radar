<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>简历雷达 · 工作流确认</title><style>
:root{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#263447;background:#16162a}*{box-sizing:border-box}body{margin:0}header{padding:24px 5vw;color:#edf3ff;background:#12121f;display:flex;justify-content:space-between;align-items:center}header strong{font-size:22px}header span{color:#a5b1c8;font-size:13px}.shell{max-width:1120px;margin:32px auto;padding:0 24px;display:grid;grid-template-columns:290px 1fr;gap:24px}aside{color:#cad5e9;padding:18px 8px}aside h2{font-size:21px;line-height:1.6}aside p{font-size:13px;line-height:1.9;color:#a8b5cb}.step{padding:15px;border:1px solid #44465c;border-radius:8px;margin:14px 0;font-size:13px}.step.active{border-color:#64b6dc;background:#2b354d;color:white}.panel{background:#fff;border-radius:12px;padding:30px 36px}h1{font-size:25px;margin:0 0 9px}.intro{color:#748196;font-size:13px;line-height:1.8}label.field{display:block;font-size:13px;font-weight:600;margin:23px 0 9px}input[type=text],select,textarea{font:inherit;width:100%;border:1px solid #ced8e3;border-radius:7px;padding:11px;background:white;color:#263447}textarea{min-height:90px;resize:vertical}.checks{display:flex;gap:15px;flex-wrap:wrap;font-size:13px}.checks label{padding:10px 12px;border:1px solid #dce5eb;border-radius:6px}input{accent-color:#117f82}button{background:#117f82;color:white;border:0;border-radius:7px;padding:13px 22px;font:inherit;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #4a9eff;outline-offset:3px}footer{margin-top:28px;padding-top:20px;border-top:1px solid #e3e8ee;display:flex;align-items:center;justify-content:space-between;gap:15px}footer small{color:#748196;font-size:11px}.job{display:block;padding:14px;border:1px solid #dce5eb;border-radius:7px;margin:10px 0;font-size:13px;line-height:1.9}.job small{display:block;color:#748196;margin-left:22px}.job a{color:#2879c8}.route{padding:12px;background:#edf6f7;color:#117f82;border-radius:6px;font-size:13px;margin-top:15px}#message{font-size:13px;line-height:1.9;margin-top:16px;color:#a43a41}[hidden]{display:none!important}@media(max-width:750px){.shell{display:block;margin:15px auto;padding:0 12px}aside{padding:0 8px}aside h2,aside p{display:none}.step{display:inline-block;margin:8px 4px}.panel{padding:24px 20px}header{padding:20px}header span{font-size:11px}}
</style><header><strong>◉ 简历雷达</strong><span>岗位发现 → 诊断 → 差距分析 → 优化</span></header><main class="shell"><aside><h2>先确认目标，<br>再执行适合你的分析。</h2><p>AI 根据简历与指令预填。你可以修改目标、分析重点和输出范围。</p><div class="step" id="step1">01 · 需求确认</div><div class="step" id="step2">02 · 分析方案确认</div><p id="goal-summary"></p></aside><section class="panel"><h1 id="title"></h1><p class="intro" id="intro"></p><form id="form"><div id="stage1"><label class="field" for="target-choice">目标岗位</label><select id="target-choice"><option value="unclear">不明确，先帮我探索方向</option><option value="specified">已有意向岗位</option></select><div id="target-details"><label class="field" for="target">意向岗位名称</label><input id="target" type="text" placeholder="例如 AI 产品经理"></div><label class="field" for="source">JD 来源</label><select id="source"><option value="provided">用户提供</option><option value="auto">自动寻找</option><option value="none">暂不使用 JD，做通用诊断</option></select><div class="route" id="route"></div><label class="field">分析重点</label><div class="checks" id="focus"></div></div><div id="stage2"><label class="field" for="plan-target">本次分析目标</label><input id="plan-target" type="text" placeholder="通用诊断可留空"><label class="field">已选定的目标 JD</label><div id="jobs"></div><label class="field" for="capabilities">核心能力要求</label><textarea id="capabilities"></textarea><label class="field" for="scope">简历修改范围</label><textarea id="scope"></textarea><label class="field">输出选项</label><div class="checks"><label><input type="checkbox" id="sentence">逐句审阅</label><label><input type="checkbox" id="optimized">生成优化后的简历</label></div></div><footer><small>确认结果保存在本机，分析由 Codex 执行。</small><button id="submit" type="submit"></button></footer><div id="message" role="status" aria-live="polite"></div></form></section></main><script>/* PREFILL */
const $=s=>document.querySelector(s);const first=PREFILL.stage===1;$('#stage1').hidden=!first;$('#stage2').hidden=first;$('#step'+PREFILL.stage).classList.add('active');$('#title').textContent=first?'确认求职目标':'确认分析对象与输出';$('#intro').textContent=first?'以下为 AI 预填内容，请根据实际求职意愿修改。':'确认目标 JD、核心能力和修改范围后，Codex 才开始正式分析。';$('#submit').textContent=first?'确认需求，准备分析方案':'确认方案，开始分析';
if(first){$('#target-choice').value=PREFILL.target_choice||(PREFILL.target?'specified':'unclear');const toggleTarget=()=>$('#target-details').hidden=$('#target-choice').value==='unclear';$('#target-choice').onchange=toggleTarget;toggleTarget();$('#target').value=PREFILL.target||'';$('#source').value=PREFILL.jd_source||'none';for(const text of ['岗位匹配','项目经历','业务价值','能力差距','表达结构']){const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.value=text;input.checked=(PREFILL.focus||['项目经历','业务价值','表达结构']).includes(text);label.append(input,document.createTextNode(text));$('#focus').append(label);}const route=()=>$('#route').textContent=({provided:'Route 01 · JD 已提供：岗位精准匹配',auto:'Route 02 · 没有 JD：自动发现岗位',none:'Route 03 · 只有简历：通用简历诊断'})[$('#source').value];$('#source').onchange=route;route();}
else{$('#plan-target').value=PREFILL.target||PREFILL.goal.target||'';$('#goal-summary').textContent=(PREFILL.goal.target||'通用简历诊断')+' / '+PREFILL.goal.focus.join('、');$('#capabilities').value=PREFILL.capabilities||'';$('#scope').value=PREFILL.modification_scope||'完整简历';$('#sentence').checked=PREFILL.sentence_review!==false;$('#optimized').checked=PREFILL.optimized_resume===true;for(const job of PREFILL.jobs||[]){const label=document.createElement('label');label.className='job';const input=document.createElement('input');input.type='checkbox';input.value=job.source_id;input.className='jd-choice';input.checked=(PREFILL.selected_jd_ids||[]).includes(job.source_id);input.disabled=job.availability==='closed';const strong=document.createElement('strong');strong.textContent=job.title+' · '+(job.company||'用户提供');const detail=document.createElement('small');detail.textContent=(job.rationale||'')+(job.availability==='unknown'?'（招聘状态未核实）':'');label.append(input,strong,detail);if(job.url){try{const u=new URL(job.url);if(['https:','http:'].includes(u.protocol)){const a=document.createElement('a');a.href=u.href;a.target='_blank';a.rel='noopener';a.textContent=' 查看原始 JD';label.append(a);}}catch{}}$('#jobs').append(label);}if(!(PREFILL.jobs||[]).length)$('#jobs').textContent=PREFILL.goal.route==='03'?'通用诊断，不使用目标 JD。':'尚无可选 JD，请回到 Codex 补充或检索。';}
$('#form').onsubmit=async e=>{e.preventDefault();$('#submit').disabled=true;const body=first?{target_choice:$('#target-choice').value,target:$('#target-choice').value==='specified'?$('#target').value:'',jd_source:$('#source').value,focus:[...document.querySelectorAll('#focus input:checked')].map(x=>x.value)}:{target:$('#plan-target').value,selected_jd_ids:[...document.querySelectorAll('.jd-choice:checked')].map(x=>x.value),capabilities:$('#capabilities').value,modification_scope:$('#scope').value,sentence_review:$('#sentence').checked,optimized_resume:$('#optimized').checked};try{const r=await fetch('/confirm',{method:'POST',headers:{'Content-Type':'application/json','X-Radar-Token':TOKEN},body:JSON.stringify(body)});const data=await r.json();if(!data.ok)throw new Error(data.error);$('#message').style.color='#117f82';$('#message').textContent=first?'需求已确认。回到 Codex，准备岗位和分析方案。':'方案已确认。回到 Codex，继续执行分析。';$('#submit').textContent='已确认';}catch(err){$('#message').textContent=err.message;$('#submit').disabled=false;}};
</script></html>
